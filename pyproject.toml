[project]
name = "nifi-api-analyzer"
version = "0.1.0"
description = "API-first NiFi flow analysis tool with Databricks LLM integration"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Eric Liao", email = "ericliaoyf@gmail.com" }
]
keywords = ["nifi", "apache-nifi", "flow-analysis", "databricks", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "streamlit>=1.28.0",
    "requests>=2.31.0",
    "backoff>=2.2.1",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nifi_client", "analyzers", "streamlit_app"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
